name: Test Update Script

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'update-tailscale.sh'
      - '.github/workflows/test-script.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'update-tailscale.sh'
      - '.github/workflows/test-script.yaml'

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          format: gcc
          severity: warning
          additional_files: 'update-tailscale.sh'

  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [dash, bash, sh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y dash

      - name: Check syntax with ${{ matrix.shell }}
        run: |
          ${{ matrix.shell }} -n update-tailscale.sh

  flag-tests:
    name: Flag Parsing Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test --help flag
        run: |
          output=$(sh update-tailscale.sh --help 2>&1)
          echo "$output" | grep -q "Usage:" || exit 1
          echo "$output" | grep -q "\-\-log" || exit 1
          echo "✓ --help flag works correctly"

      - name: Test invalid flag
        run: |
          output=$(sh update-tailscale.sh --invalid-flag 2>&1 || true)
          echo "$output" | grep -q "Unknown argument" || exit 1
          echo "✓ Invalid flag detection works"

      - name: Test version output
        run: |
          version=$(grep 'SCRIPT_VERSION=' update-tailscale.sh | head -1 | cut -d'"' -f2)
          echo "Script version: $version"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]] || exit 1
          echo "✓ Version format is correct"

  posix-compliance:
    name: POSIX Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for bash-specific syntax
        run: |
          echo "Checking for common bashisms..."

          # Check for == in test conditions (should be =)
          if grep -n '\[ .*==.*\]' update-tailscale.sh; then
            echo "❌ Found == in test condition (use = for POSIX compliance)"
            exit 1
          fi

          # Check for [[ ]] (bash-specific)
          if grep -n '\[\[' update-tailscale.sh; then
            echo "❌ Found [[ ]] (use [ ] for POSIX compliance)"
            exit 1
          fi

          # Check for $( ) command substitution (POSIX allows this)
          echo "✓ Command substitution syntax is acceptable"

          echo "✓ No bashisms detected"

  backup-tests:
    name: Backup Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write backup regression test
        run: |
          cat > "$RUNNER_TEMP/test_backup.sh" << 'EOF'
          #!/bin/sh
          # Runs inside a throwaway container, so /etc/config and /root can be
          # written for real without touching the runner.
          set -eu

          SCRIPT=/src/update-tailscale.sh

          log() { :; }
          BACKUP_PATH=""

          eval "$(sed -n '/^backup() {/,/^}/p' "$SCRIPT")"

          fail() { echo "FAIL: $1" >&2; exit 1; }

          reset_state() {
              rm -rf /etc/config/tailscale /root/tailscale_config_backup
              mkdir -p /etc/config
              BACKUP_PATH=""
          }

          # 1) regular UCI config file - the GL.iNet case
          reset_state
          printf '%s\n' "config settings 'settings'" > /etc/config/tailscale
          backup || fail "backup returned non-zero for a regular config file"
          [ -n "$BACKUP_PATH" ] || fail "BACKUP_PATH is empty for a regular config file"
          [ -s "$BACKUP_PATH" ] || fail "archive is empty for a regular config file"
          tar tzf "$BACKUP_PATH" | grep -qx 'etc/config/tailscale' \
              || fail "archive does not contain etc/config/tailscale"
          echo "OK: regular config file is backed up"

          # 2) directory - covers -e instead of -f
          reset_state
          mkdir -p /etc/config/tailscale
          printf '%s\n' "state" > /etc/config/tailscale/tailscaled.state
          backup || fail "backup returned non-zero for a config directory"
          [ -n "$BACKUP_PATH" ] || fail "BACKUP_PATH is empty for a config directory"
          tar tzf "$BACKUP_PATH" | grep -qx 'etc/config/tailscale/tailscaled.state' \
              || fail "archive does not contain the directory contents"
          echo "OK: config directory is backed up"

          # 3) no config at all - GLKVM Comet Pro, issue #83
          reset_state
          backup || fail "backup must succeed when there is no config to back up"
          [ -z "$BACKUP_PATH" ] || fail "BACKUP_PATH must stay empty when there is no config"
          echo "OK: missing config is skipped without an error"

          # 4) backup directory cannot be created - must abort, not claim success
          reset_state
          printf '%s\n' "config settings 'settings'" > /etc/config/tailscale
          : > /root/tailscale_config_backup
          if backup 2>/dev/null; then
              fail "backup must fail when the backup directory cannot be created"
          fi
          [ -z "$BACKUP_PATH" ] || fail "BACKUP_PATH must be cleared when the backup fails"
          echo "OK: a failing backup aborts and clears BACKUP_PATH"

          # --- /etc/sysupgrade.conf handling -------------------------------
          IS_GLINET=1
          USER_WANTS_PERSISTENCE="y"
          eval "$(sed -n '/^upgrade_persistance() {/,/^}/p' "$SCRIPT")"

          # 5) a stale backup entry is dropped even when no new backup exists
          BACKUP_PATH=""
          printf '%s\n' "/root/tailscale_config_backup/.tar.gz" > /etc/sysupgrade.conf
          upgrade_persistance
          if grep -q "tailscale_config_backup" /etc/sysupgrade.conf; then
              fail "stale backup entry was not removed from /etc/sysupgrade.conf"
          fi
          echo "OK: stale backup entry is removed without a new backup"

          # 6) a fresh backup replaces the previous entry
          reset_state
          printf '%s\n' "config settings 'settings'" > /etc/config/tailscale
          backup || fail "backup returned non-zero while preparing the persistence test"
          printf '%s\n' "/root/tailscale_config_backup/old.tar.gz" > /etc/sysupgrade.conf
          upgrade_persistance
          grep -qxF "$BACKUP_PATH" /etc/sysupgrade.conf \
              || fail "the new backup path is missing from /etc/sysupgrade.conf"
          [ "$(grep -c "tailscale_config_backup" /etc/sysupgrade.conf)" -eq 1 ] \
              || fail "/etc/sysupgrade.conf holds more than one backup entry"
          echo "OK: a fresh backup replaces the previous entry"

          echo "All backup regression tests passed"
          EOF

      - name: Run backup regression tests in an isolated container
        run: |
          docker run --rm \
            -v "$PWD/update-tailscale.sh:/src/update-tailscale.sh:ro" \
            -v "$RUNNER_TEMP/test_backup.sh:/src/test_backup.sh:ro" \
            -w /src alpine:3.20 sh /src/test_backup.sh

  log-function-tests:
    name: Log Function Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test log function with ASCII mode
        run: |
          # Create a test script that sources the functions
          cat > test_log.sh << 'EOF'
          #!/bin/sh
          ASCII_MODE=1
          SHOW_LOG=0
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[0;33m'
          INFO='\033[0m'

          # Source the log function from the main script
          eval "$(sed -n '/^log() {/,/^}/p' update-tailscale.sh)"

          # Test ASCII mode
          output=$(log "SUCCESS" "Test message")
          echo "$output" | grep -q "\[OK\]" || exit 1
          echo "✓ ASCII mode SUCCESS works"

          output=$(log "ERROR" "Test message")
          echo "$output" | grep -q "\[X\]" || exit 1
          echo "✓ ASCII mode ERROR works"

          output=$(log "WARNING" "Test message")
          echo "$output" | grep -q "\[!\]" || exit 1
          echo "✓ ASCII mode WARNING works"

          output=$(log "INFO" "Test message")
          echo "$output" | grep -q "\[->\]" || exit 1
          echo "✓ ASCII mode INFO works"
          EOF

          chmod +x test_log.sh
          sh test_log.sh

      - name: Test timestamp functionality
        run: |
          cat > test_timestamp.sh << 'EOF'
          #!/bin/sh
          ASCII_MODE=0
          SHOW_LOG=1
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[0;33m'
          INFO='\033[0m'

          eval "$(sed -n '/^log() {/,/^}/p' update-tailscale.sh)"

          # Test with timestamps
          output=$(log "INFO" "Test message")
          echo "$output" | grep -q "\[20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]" || exit 1
          echo "✓ Timestamp format works"
          EOF

          chmod +x test_timestamp.sh
          sh test_timestamp.sh

  readme-consistency:
    name: README Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if new flags are documented
        run: |
          echo "Checking if all flags are documented in README..."

          # Extract flags from the argument parsing section only
          script_flags=$(sed -n '/# Read arguments/,/esac/p' update-tailscale.sh | grep -o '\--[a-z-]*' | grep -v -e 'stateful-filtering' -e 'advertise-routes' | sort -u)

          # Check each flag is in README
          for flag in $script_flags; do
            if ! grep -q -- "$flag" readme.md; then
              echo "❌ Flag $flag not found in README"
              exit 1
            fi
          done

          echo "✓ All flags are documented in README"

  integration-check:
    name: Integration Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify all functions are defined
        run: |
          echo "Checking for undefined function calls..."

          # List of expected functions
          functions=(
            "invoke_intro"
            "preflight_check"
            "backup"
            "get_latest_tailscale_version_tiny"
            "get_latest_tailscale_version"
            "compress_binaries"
            "install_tailscale"
            "install_tiny_tailscale"
            "upgrade_persistance"
            "restore"
            "invoke_outro"
            "invoke_help"
            "invoke_update"
            "invoke_modify_script"
            "restart_tailscale"
            "log"
            "choose_release_label"
          )

          for func in "${functions[@]}"; do
            if ! grep -q "^${func}()" update-tailscale.sh; then
              echo "❌ Function $func not found"
              exit 1
            fi
          done

          echo "✓ All expected functions are defined"

      - name: Check for hardcoded values
        run: |
          echo "Checking for potential issues..."

          # Check if URLs are using variables
          if grep -n 'github.com/Admonstrator/glinet-tailscale-updater' update-tailscale.sh | grep -v 'TAILSCALE_TINY_URL\|UPDATE_URL\|Thread:'; then
            echo "⚠️  Found hardcoded GitHub URLs (consider using variables)"
          fi

          echo "✓ Check complete"
